<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonic UI shared CDN runtime demo</title>
  <script>
    (() => {
      const colorMode = new URLSearchParams(location.search).get('colorMode') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-color-scheme', colorMode);
    })();
  </script>
  <style>
    html { background-color: #fcfcfc; color-scheme: light; }
    html[data-color-scheme="dark"] { background-color: #1b1b1b; color-scheme: dark; }
    body { margin: 0; }
    #root { display: flow-root; }
  </style>
</head>
<body>
  <div id="root"></div>
  <p id="startup-error" role="alert" hidden>Cannot start the demo. Check the browser console.</p>
  <script>
    window.addEventListener('error', (event) => {
      if (!document.getElementById('root').childElementCount) {
        document.getElementById('startup-error').hidden = false;
      }
    }, true);
  </script>
  <script type="module">
    import { mount } from './shell/assets/shell.js';
    mount(document.getElementById('root'));
  </script>
  <noscript>This demo requires JavaScript.</noscript>
</body>
</html>
