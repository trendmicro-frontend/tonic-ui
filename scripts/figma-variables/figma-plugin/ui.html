<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .status {
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        margin-bottom: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status.ok {
        background: #e6f4ea;
        color: #137333;
      }
      .status.err {
        background: #fce8e6;
        color: #c5221f;
      }
      .meta {
        font-size: 11px;
        color: var(--figma-color-text-secondary, #666);
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--figma-color-border, #d9d9d9);
        background: var(--figma-color-bg, #fff);
        color: inherit;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover {
        background: var(--figma-color-bg-hover, #f0f0f0);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Tonic UI Token Export</h1>
    <div class="status" id="status" role="status" aria-live="polite">Reading variables</div>
    <div class="meta" id="meta"></div>
    <button id="download" disabled>Download JSON</button>

    <script>
      const statusEl = document.getElementById('status');
      const metaEl = document.getElementById('meta');
      const downloadBtn = document.getElementById('download');

      let currentPayload = null;

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
      }

      function summarise(payload) {
        const vars = payload.meta ? Object.keys(payload.meta.variables).length : 0;
        const cols = payload.meta
          ? Object.keys(payload.meta.variableCollections).length
          : 0;
        return { vars, cols };
      }


      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'progress') {
          currentPayload = null;
          downloadBtn.disabled = true;
          metaEl.textContent = '';
          if (msg.total) {
            setStatus(
              (msg.phase ? msg.phase + ' ' : 'Resolving aliases ') +
                msg.done +
                '/' +
                msg.total
            );
          }
          return;
        }

        if (msg.type === 'error') {
          currentPayload = null;
          downloadBtn.disabled = true;
          metaEl.textContent = '';
          setStatus('Unable to export variables.\n' + msg.message, 'err');
          return;
        }

        if (msg.type === 'payload') {
          currentPayload = msg.payload;
          const { vars, cols } = summarise(currentPayload);
          metaEl.textContent =
            (currentPayload.fileName || '(unnamed file)') +
            ' — ' +
            vars +
            ' variables in ' +
            cols +
            ' collections';
          downloadBtn.disabled = false;
          setStatus('Variables are ready to download. The repository has not been updated.', 'ok');
        }
      };

      downloadBtn.onclick = () => {
        if (!currentPayload) return;
        const json = JSON.stringify(currentPayload, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const safeName = (currentPayload.fileName || 'figma-variables')
          .replace(/[^\w.-]+/g, '-')
          .replace(/^-+|-+$/g, '');
        a.href = url;
        a.download = (safeName || 'figma-variables') + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
    </script>
  </body>
</html>
