name: ci-branch

on:
  push:
    branches:
      - v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idoutputs
    outputs:
      TONIC_UI_REACT_DOCS_VERSION: ${{ steps.step_setup_env.outputs.TONIC_UI_REACT_DOCS_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch the entire Git history to access the latest tag release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Check installed versions
        run: |
          git --version
          node --version
          npm --version
          yarn --version

      - name: Configure environment variables
        id: step_setup_env
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Get version label from config (config-driven!)
          TONIC_UI_REACT_VERSION=$(node -e "
            const config = require('./tonic-ui-version.config.js');
            const refName = process.env.REF_NAME;
            const version = config.versions.find(v => v.branch === refName);
            console.log(version ? version.label : refName);
          ")

          # Validate version is set
          if [ -z "$TONIC_UI_REACT_VERSION" ]; then
            echo "Error: Failed to determine TONIC_UI_REACT_VERSION for branch ${REF_NAME}"
            exit 1
          fi

          echo "CI_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "CI_COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "MATOMO_URL=//matomo.xdr.trendmicro.com" >> $GITHUB_ENV
          echo "MATOMO_CONTAINER_ID=N8rpl9LU" >> $GITHUB_ENV
          echo "TONIC_UI_REACT_DOCS_BASE_PATH=/tonic-ui-docs/${TONIC_UI_REACT_VERSION}" >> $GITHUB_ENV
          echo "TONIC_UI_REACT_DOCS_VERSION=${TONIC_UI_REACT_VERSION}" >> $GITHUB_ENV

          # $GITHUB_OUTPUT is shared between all steps in a job
          echo "TONIC_UI_REACT_DOCS_VERSION=${TONIC_UI_REACT_VERSION}" >> $GITHUB_OUTPUT

      - name: Install packages
        run: |
          yarn up
          yarn install

      - name: Build & Test
        run: |
          yarn build
          yarn lint
          yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: |
            ./packages/changelog-github/coverage/lcov.info
            ./packages/react/coverage/lcov.info
            ./packages/react-hooks/coverage/lcov.info
            ./packages/react-lab/coverage/lcov.info
            ./packages/styled-system/coverage/lcov.info
            ./packages/theme/coverage/lcov.info
            ./packages/utils/coverage/lcov.info

      - name: Prepare artifact
        run: |
          mkdir -p ${{ github.workspace }}/artifact
          tar -zcvf ${{ github.workspace }}/artifact/react-docs.tar.gz --dereference --directory packages/react-docs/dist .
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifact
          path: |
            artifact/react-docs.tar.gz
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-tonic-ui-docs
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_APP_ID || secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tonic-ui-docs

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-artifact
          path: artifact

      - name: Extract artifact
        run: |
          mkdir -p artifact/react-docs
          tar -zxvf artifact/react-docs.tar.gz --directory artifact/react-docs

      - name: Deploy to tonic-ui-docs
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          TONIC_UI_REACT_DOCS_VERSION: ${{ needs.build.outputs.TONIC_UI_REACT_DOCS_VERSION }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REMOTE="https://x-access-token:${DEPLOY_TOKEN}@github.com/${OWNER}/tonic-ui-docs.git"
          TARGET_DIR="${RUNNER_TEMP}/tonic-ui-docs"

          for attempt in 1 2 3 4 5; do
            rm -rf "${TARGET_DIR}"
            # Publish to gh-pages; create it as an orphan branch on first deploy.
            if git clone --depth 1 --branch gh-pages "${REMOTE}" "${TARGET_DIR}" 2>/dev/null; then
              :
            else
              git clone --depth 1 "${REMOTE}" "${TARGET_DIR}"
              git -C "${TARGET_DIR}" checkout --orphan gh-pages
              git -C "${TARGET_DIR}" rm -rf . >/dev/null 2>&1 || true
            fi

            rm -rf "${TARGET_DIR:?}/${TONIC_UI_REACT_DOCS_VERSION}"
            mkdir -p "${TARGET_DIR}/${TONIC_UI_REACT_DOCS_VERSION}"
            cp -af artifact/react-docs/** "${TARGET_DIR}/${TONIC_UI_REACT_DOCS_VERSION}/"

            # Disable Jekyll so Next.js _next/ assets are served
            touch "${TARGET_DIR}/.nojekyll"

            cd "${TARGET_DIR}"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to publish."
              break
            fi
            git commit -m "Deploy ${TONIC_UI_REACT_DOCS_VERSION} (${SOURCE_SHA:0:8}) [skip ci]"
            if git push origin gh-pages; then
              echo "Pushed on attempt ${attempt}."
              break
            fi
            echo "Push rejected (attempt ${attempt}); re-cloning and retrying..."
            cd - >/dev/null
            sleep $((attempt * 3))
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Failed to push to tonic-ui-docs after 5 attempts"
              exit 1
            fi
          done
