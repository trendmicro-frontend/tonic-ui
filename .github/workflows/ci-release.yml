# This workflow will release the packages with Changesets

name: ci-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions: {}

jobs:
  release:
    # [IMPORTANT] Prevent this action from running on forks
    if: github.repository == 'trendmicro-frontend/tonic-ui'
    permissions:
      contents: write       # to create release (changesets/action)
      issues: write         # to post issue comments (changesets/action)
      pull-requests: write  # to create pull request (changesets/action)
      id-token: write       # to request OIDC token for npm Trusted Publishing
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          # Fetch the entire Git history to ensure `Changesets` can generate changelogs with the correct commits
          fetch-depth: 0
      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Install Dependencies
        id: install-dependencies
        run: yarn install
      - name: Build `changelog-github` package
        id: build-changelog-github
        working-directory: ./packages/changelog-github
        run: yarn build
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          # This expects you to have a script called version that runs some logic and then calls `changeset version`.
          version: yarn ci-version
          # This expects you to have a script called release which does a build for your packages and calls `changeset publish`
          publish: 'bash -c "eval \"$PUBLISH_COMMAND\""'
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          PUBLISH_COMMAND: |
            if output=$(FORCE_COLOR=0 yarn ci-publish --summary-file=publish-summary.json 2>&1); then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "${output}"
            if [ "${status}" -ne 0 ]; then
              exit "${status}"
            fi
            if grep -Eq '^lerna success (No changed packages to publish|All packages have already been published\.)$' <<< "${output}"; then
              echo "nothing_to_publish=true" >> "${GITHUB_OUTPUT}"
            fi

      - name: Report published packages
        # The action only runs the publish script when no changesets are pending;
        # with pending changesets it just opens the version PR.
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          PUBLISH_SUMMARY_FILE: publish-summary.json
          NOTHING_TO_PUBLISH: ${{ steps.changesets.outputs.nothing_to_publish }}
        run: |
          write_table() {
            echo "| Package | Version |"
            echo "| --- | --- |"
            jq -r '.[] | "| `\(.packageName)` | \(.version) |"' "${PUBLISH_SUMMARY_FILE}"
          }

          if [ ! -f "${PUBLISH_SUMMARY_FILE}" ]; then
            # Lerna 9 emits these success messages without creating a summary.
            if [ "${NOTHING_TO_PUBLISH}" = "true" ]; then
              echo "::notice::Nothing to publish."
              {
                echo "## Nothing to publish"
                echo
                echo "Lerna reported that no packages needed publishing."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            echo "::warning::Unable to confirm the publish result. Check the publish log."
            {
              echo "## Publish result unavailable"
              echo
              echo "The summary file was not created. Check the publish log for the result."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          packages=$(jq -r '[.[] | "\(.packageName)@\(.version)"] | join(", ")' "${PUBLISH_SUMMARY_FILE}")
          echo "::notice::Published ${packages}"
          {
            echo "## Published packages"
            echo
            write_table
          } >> "${GITHUB_STEP_SUMMARY}"
