name: ci-publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch the entire Git history to access the latest tag release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Install packages
        run: |
          yarn up
          yarn install

      - name: Publish packages
        env:
          PUBLISH_SUMMARY_FILE: publish-summary.json
        run: yarn ci-publish --summary-file="${PUBLISH_SUMMARY_FILE}"

      - name: Report published packages
        env:
          PUBLISH_SUMMARY_FILE: publish-summary.json
        run: |
          write_table() {
            echo "| Package | Version |"
            echo "| --- | --- |"
            jq -r '.[] | "| `\(.packageName)` | \(.version) |"' "${PUBLISH_SUMMARY_FILE}"
          }

          if [ ! -f "${PUBLISH_SUMMARY_FILE}" ]; then
            echo "::notice::Nothing to publish."
            {
              echo "## Nothing to publish"
              echo
              echo "Every package version already exists on the registry."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          packages=$(jq -r '[.[] | "\(.packageName)@\(.version)"] | join(", ")' "${PUBLISH_SUMMARY_FILE}")
          echo "::notice::Published ${packages}"
          {
            echo "## Published packages"
            echo
            write_table
          } >> "${GITHUB_STEP_SUMMARY}"
